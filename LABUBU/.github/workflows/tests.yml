name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[baselines,figures]"
      - run: python -m unittest discover -s tests -v
      - run: labubu examples/clifford4.qasm --capacity 5 --qpus 2 --runs 2 --workers 2 --iterations 10 --output outputs/smoke.json
      - run: python experiments/verify_results.py
